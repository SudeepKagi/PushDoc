services:
  mongo:
    image: mongo:8
    container_name: pushdoc-mongo
    restart: unless-stopped
    networks:
      - pushdoc-network
    ports:
      - "27017:27017"
    volumes:
      - pushdoc-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: pushdoc-redis
    restart: unless-stopped
    networks:
      - pushdoc-network
    ports:
      - "6379:6379"
    volumes:
      - pushdoc-redis-data:/data

  mongo-seed:
    image: mongo:8
    container_name: pushdoc-mongo-seed
    networks:
      - pushdoc-network
    depends_on:
      - mongo
    restart: "no"
    command: >
      mongosh mongodb://mongo:27017/pushdoc --eval '
      db = db.getSiblingDB("pushdoc");

      const githubId = "216111331";

      const existingUser = db.users.findOne({
        $or: [{ githubId: githubId }, { githubUsername: "SudeepKagi" }]
      });

      if (!existingUser) {
        db.users.insertOne({
          githubId: "216111331",
          githubUsername: "SudeepKagi",
          email: "sudeepskagi@gmail.com",
          autoReadmeEnabled: true,
          avatarUrl: "https://avatars.githubusercontent.com/u/216111331?v=4",
          emailNotificationsEnabled: true,
          admin: true,
          githubAccessToken: {
            iv: "e4675bc687f840287fd9bbac",
            content: "47963e689832dae04d0029c955f379c07dff6ca6c73bb7a5173f5016fb048b14e7b8ab8eba2cc8c6",
            tag: "59b06067c272aa365149e2056071d1c8"
          },
          createdAt: ISODate("2026-08-20T20:50:53.009Z"),
          updatedAt: ISODate("2026-08-20T20:50:53.009Z")
        });

        print("Seeded PushDoc admin user");
      } else {
        db.users.updateOne(
          { _id: existingUser._id },
          { $set: { admin: true, githubId: githubId, updatedAt: new Date() } }
        );
        print("PushDoc user found — admin flag ensured");
      }
      '

volumes:
  pushdoc-mongo-data:
    name: pushdoc-mongo-data
  pushdoc-redis-data:
    name: pushdoc-redis-data
networks:
  pushdoc-network:
    name: pushdoc-network
    driver: bridge
