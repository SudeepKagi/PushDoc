[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pushdoc-ai"
version = "0.1.0"
description = "Resilient AI sidecar for PushDoc"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langchain-core==1.6.10",
  "langchain-openai==1.7.1",
  "langgraph==1.2.15",
  "langgraph-checkpoint-sqlite==3.1.2",
  "lancedb==0.40.0",
  "markdown-it-py==4.2.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "tenacity==9.1.2",
  "tree-sitter-language-pack==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "respx==0.22.0", "ruff==0.12.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/pushdoc_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
