<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushDoc — Your README, on autopilot</title>
    <meta
      name="description"
      content="Connect a GitHub repo once, and every push to main comes back as an up-to-date README. Powered by Gemini & Sarvam AI."
    />

    <!-- Open Graph / Facebook / Discord / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://push-doc.vercel.app/" />
    <meta property="og:title" content="PushDoc — Your README, on autopilot" />
    <meta
      property="og:description"
      content="Connect a GitHub repo once, and every push to main comes back as an up-to-date README. No templates, no docs drifting behind code."
    />
    <meta
      property="og:image"
      content="https://push-doc.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PushDoc — Your README, on autopilot" />
    <meta
      name="twitter:description"
      content="Connect a GitHub repo once, and every push to main comes back as an up-to-date README."
    />
    <meta
      name="twitter:image"
      content="https://push-doc.vercel.app/og-image.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/siteLogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preload self-hosted font -->
    <link
      rel="preload"
      href="/inter-display.p.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Space Grotesk for display headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
